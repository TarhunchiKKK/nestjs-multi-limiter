name: "🐛 Bug Report"
description: Report an error or unexpected behavior in the library
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping us improve the library! Please fill out the form below.
  
  - type: input
    id: version
    attributes:
      label: Library version
      placeholder: "e.g., v1.2.4"
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment info
      placeholder: "e.g., Node.js v20.11.0"
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproducible example
      description: Provide a short, isolated code snippet that triggers the issue.
      placeholder: |
        ```typescript
        
        ```
    validations:
      required: true

  - type: textarea
    id: behavior
    attributes:
      label: Expected & Actual behavior
      description: What did you expect to happen, and what actually happened instead?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or stack traces
      placeholder: Paste console output or error logs here